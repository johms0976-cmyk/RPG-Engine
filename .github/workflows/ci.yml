name: CI

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Unit tests
        run: npm run test
      - name: Playtest — every module survives being run end to end
        run: npm run playtest
      - name: Production build
        run: npm run build
      - name: Check the build produced something
        run: test -f dist/index.html && test -d dist/assets
