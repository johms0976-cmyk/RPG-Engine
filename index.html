<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0A0A0B" />
    <title>Mothership Engine</title>
    <meta name="description" content="An offline engine for playing Mothership sci-fi horror RPG modules. Runs entirely in the browser — no account, no network, no API key." />
    <meta property="og:title" content="Mothership Engine" />
    <meta property="og:description" content="Play Mothership modules offline. Crew, combat, panic, rest and progression, with a local Warden." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230A0A0B'/%3E%3Crect x='6' y='6' width='20' height='20' fill='none' stroke='%23F5C518' stroke-width='3'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      html, body, #root { margin: 0; padding: 0; min-height: 100%; background: #0A0A0B; }
      /* Font stack falls back cleanly if the webfonts are blocked or the
         machine is offline, which for this engine is a supported case. */
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript style="color:#EDEAE3;font-family:monospace;padding:24px;display:block">
      This engine runs entirely in your browser and needs JavaScript enabled. It does not
      send anything anywhere.
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
